    <!-- Boot skeleton. Inline so the page never shows a white flash between
         body-paint and Vue mount. The boxes mirror the real card layout
         (header pills, pace card, insight, metrics row, controls) so the
         user sees the final visual rhythm before content fills in, no
         layout shift when the app takes over. App.vue adds `boot-ready`
         to <html> once the app is actually ready (mounted + sync done if
         applicable); CSS handles the 200ms crossfade out. -->
    <style>
      #boot-skeleton {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #fcfcfd;
        overflow: hidden;
        transition: opacity 0.22s ease-out;
      }
      #boot-skeleton .sk-container {
        max-width: 940px;
        margin: 0 auto;
        padding: 24px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      #boot-skeleton .sk-header {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 4px 4px 6px;
      }
      #boot-skeleton .sk-logo {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        flex-shrink: 0;
        background: linear-gradient(135deg, #fb923c, #f43f5e, #d946ef);
      }
      #boot-skeleton .sk-brand-text {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      #boot-skeleton .sk-line { height: 12px; border-radius: 6px; background: rgba(15, 23, 42, 0.06); }
      #boot-skeleton .sk-line.w70 { width: 70%; }
      #boot-skeleton .sk-line.w40 { width: 40%; }
      #boot-skeleton .sk-actions { display: inline-flex; gap: 8px; flex-shrink: 0; }
      #boot-skeleton .sk-pill {
        height: 34px;
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.05);
        box-sizing: border-box;
      }
      #boot-skeleton .sk-card {
        background: rgba(15, 23, 42, 0.04);
        border: 1px solid rgba(15, 23, 42, 0.06);
        border-radius: 22px;
        position: relative;
        overflow: hidden;
      }
      /* Heights chosen to roughly match the real card heights at the
         max-width=940 layout — gives the user the same vertical rhythm
         the loaded app will have. */
      #boot-skeleton .sk-pace      { height: 180px; }
      #boot-skeleton .sk-insight   { height: 240px; }
      #boot-skeleton .sk-metrics   { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
      #boot-skeleton .sk-metric    { height: 110px; }
      #boot-skeleton .sk-controls  { height: 260px; }
      /* Subtle shimmer sweep across each card to hint at activity. */
      #boot-skeleton .sk-card::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.55), transparent);
        transform: translateX(-100%);
        animation: sk-shimmer 1.6s ease-in-out infinite;
      }
      @keyframes sk-shimmer {
        0%   { transform: translateX(-100%); }
        60%  { transform: translateX(100%); }
        100% { transform: translateX(100%); }
      }
      html.boot-ready #boot-skeleton {
        opacity: 0;
        pointer-events: none;
      }
      @media (max-width: 640px) {
        #boot-skeleton .sk-header { flex-direction: column; align-items: stretch; gap: 12px; }
        #boot-skeleton .sk-actions { align-self: flex-end; }
        #boot-skeleton .sk-metrics { grid-template-columns: 1fr 1fr; }
        #boot-skeleton .sk-metric:first-child { grid-column: 1 / -1; }
        #boot-skeleton .sk-pace { height: 220px; }
        #boot-skeleton .sk-insight { height: 280px; }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-skeleton .sk-card::after { animation: none; }
      }
    </style>
