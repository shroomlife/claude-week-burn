<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Brand gradient (orange to coral to magenta), same stops as the in-app header logo -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="55%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background. iOS rounds apple-touch-icon and Android masks the adaptive icon; baking a rounded shape into the source caused white-border ghosting. -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Bolt centered inside the 80% safe zone so Android adaptive masks don't clip it -->
  <g transform="translate(256, 192)">
    <path
      fill="#ffffff"
      d="M341.333 0 L85.333 384 L213.333 384 L170.667 640 L426.667 256 L298.667 256 Z"
    />
  </g>
</svg>
